name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  office:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: office
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: office/package-lock.json
      - run: npm ci
      - run: npm run verify
