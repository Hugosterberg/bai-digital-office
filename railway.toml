# Railway — agent worker (when service root is the umbrella repo, not office/)
# Prefer: set Root Directory to `office` in Railway Settings instead.
# This file is a fallback if the service deploys from the repo root.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"

[deploy]
startCommand = "npm --prefix office run worker"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
