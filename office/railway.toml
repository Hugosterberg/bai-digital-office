# Railway — agent worker service (24/7 Claude Code + GitHub polling)
# Create a new Railway project → Deploy from GitHub → set Root Directory to `office`
# Use Dockerfile.worker (Settings → Build → Dockerfile path: Dockerfile.worker)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
